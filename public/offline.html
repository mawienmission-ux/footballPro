<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | M.MissionFootball</title>
    <meta name="theme-color" content="#0b1320" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #071521;
        color: #f4f7fb;
        font-family: Arial, sans-serif;
      }
      .card {
        max-width: 560px;
        padding: 2rem;
        border-radius: 18px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        text-align: center;
      }
      h1 { margin: 0 0 0.75rem; }
      p { margin: 0; opacity: 0.8; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>M.MissionFootball</h1>
      <p>You are offline, but the app is cached and will reconnect automatically when your connection returns.</p>
    </div>
  </body>
</html>
